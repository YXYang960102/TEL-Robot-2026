name: Deploy Dashboard to GitHub Pages
on:
  push:
    branches: [dev]
    paths:
      - 'tools/dashboard/**'
      - 'test/dashboard_control_test.cjs'
      - 'test/dashboard_page_test.cjs'
      - '.github/workflows/dashboard-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dashboard-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dashboard controls
        run: |
          node test/dashboard_control_test.cjs
          node test/dashboard_page_test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/dashboard
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
