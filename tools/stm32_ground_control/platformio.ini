; Ground-station STM32 (WeAct STM32F401CCU6 "Black Pill") for wireless
; robot control: PC Dashboard over this board's own USB-C (CDC serial) ->
; CRSF RC frames to the ELRS TX module on PA9 (half-duplex, 400000 baud),
; and the robot's status coming back as CRSF Battery frames on the same
; wire. See README.md. Built with the STM32 Arduino core for its USB CDC
; stack and HSE 25 MHz clocking (the bare-metal tools in this repo run on
; the internal RC oscillator and have no USB).
[env:blackpill_f401cc]
platform = ststm32
board = blackpill_f401cc
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-I ../stm32_elrs_common/src
	-I ../../src/IO
