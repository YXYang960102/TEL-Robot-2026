<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A5 水平伺服鏡頭跟隨測試</title>
<style>body{font:18px system-ui;background:#111827;color:#e5e7eb;max-width:850px;margin:40px auto;padding:20px}button{padding:14px;margin:6px;font:inherit}pre{white-space:pre-wrap;background:#1f2937;padding:20px}.warning{color:#fbbf24}</style>
<h1>A5 水平伺服鏡頭跟隨測試</h1>
<p>僅適用 mega_vision_rotate_test 韌體。方向完全由 Orin 鏡頭資料(tx)決定，這裡不能用鍵盤控制方向。</p>
<p class="warning">發射頭沒有任何限位開關：伺服可以一直轉，不會被擋下。先不要按啟用，
只看下面「鏡頭資料」面板，確認 Orin 有連上、距上次收到資料持續很小、tx/valid 隨鏡頭前目標移動合理變化。
確認資料正常後才按啟用，隨時準備按 Enter 停止或實體斷電。</p>
<button id="connect">連接 Mega</button><button id="enable" disabled>啟用鏡頭跟隨</button>
<button id="stop">停止／停用（Enter）</button><button id="disconnect">停止並斷線（Space）</button>
<h3>鏡頭資料（Orin → Mega，不論是否啟用都會更新）</h3>
<pre id="vision">尚未收到遙測</pre>
<h3>伺服狀態</h3>
<pre id="status">未連線</pre><pre id="log">尚未收到專用韌體資料</pre>
<script>
'use strict';
let port=null,reader=null,writer=null,readTask=null,closing=false,armed=false,ready=false;
let epoch=0,lastTelemetry=0,chain=Promise.resolve();
let pendingEnable=false,enableWritten=false,enableStarted=0;
const ENABLE_TIMEOUT_MS=1000;
const enc=new TextEncoder();
const el=id=>document.getElementById(id);
function controls(){el('enable').disabled=!ready||armed||pendingEnable||closing;el('connect').disabled=!!port||closing;}
function send(text){
  const ticket=epoch;
  chain=chain.then(async()=>{if(writer&&ticket===epoch)await writer.write(enc.encode(text+'\n'));})
    .catch(()=>{armed=false;pendingEnable=false;ready=false;epoch++;controls();el('status').textContent='寫入失敗；韌體將逾時停止，請斷開重連';});
  return chain;
}
function stop(reason='操作停止'){epoch++;armed=false;pendingEnable=false;enableWritten=false;controls();el('status').textContent='已要求停止／停用：'+reason;return send('X');}
function ping(){if(armed)send('P');}
function telemetry(line){
  // v4 (2026-10-10, Codex-reviewed PIDF stabilization pass): deadband
  // retired (Jeremy's explicit call, overriding Codex's "don't loosen the
  // deadband" note -- see docs/codex-handoff.md), pure output=kP*error(+
  // filtered D) now settles to zero on its own instead of a hard-coded px
  // boundary, so there's no "zone" concept left to mirror here. Added
  // dt/P/D/raw-output/saturated so a captured log has enough to judge
  // settling behavior, not just the final clamped pulse.
  // v6 (2026-10-14): v5 without the D43/D42 limit and no-limits fields (no limit
  // switches exist). I term last (acts inside |tx|<=kIZone; value in the boot banner).
  const m=/^\$VROTATE,6,([01]),(-?\d+),([A-Z_]+),(-?\d+),(-?\d+),(-?\d+),(-?\d+),([01]),(\d+),(\d+),(-?\d+),(-?\d+),(-?\d+),([01]),(-?\d+)$/.exec(line.trim());
  if(!m)return;
  ready=true;lastTelemetry=performance.now();
  if(pendingEnable&&enableWritten&&m[1]==='1'){
    {pendingEnable=false;armed=true;el('status').textContent='韌體已確認啟用；伺服現在會依鏡頭資料自動轉動';}
  } else if(m[1]==='0'&&armed){
    const reasons={TIMEOUT:'瀏覽器分頁逾時（250ms 內沒送出 P 心跳）',VISION_TIMEOUT:'Orin 鏡頭連結逾時（沒收到新資料）',BAD_COMMAND:'指令格式錯誤',OPERATOR:'停止指令',BOOT:'韌體重啟'};
    stop(reasons[m[3]]||'韌體已停用（未知原因：'+m[3]+'）');
  }
  el('log').textContent=`A5 脈寬：${m[2]} μs\n韌體啟用：${m[1]}\n停用原因：${m[3]}\n（沒有限位開關：隨時準備 Enter 停止或實體斷電）`;
  const tx=parseInt(m[4],10),absTx=Math.abs(tx);
  el('vision').textContent=`tx：${m[4]} px（正值＝目標偏右）\n誤差｜tx｜：${absTx} px\nty：${m[5]} px\ndistance：${m[6]}\ntarget_id：${m[7]}\nvalid：${m[8]==='1'?'鎖定中':'未鎖定'}\n距上次收到鏡頭資料：${m[9]} ms\ndt：${m[10]} ms\nP 分量：${m[11]} μs\nI 分量（tx 在 IZone 內才累積）：${m[15]} μs\nD 分量（濾波後）：${m[12]} μs\n夾限前輸出：${m[13]} μs\n是否飽和：${m[14]==='1'?'是（撞到輸出上限）':'否'}`;
  controls();
}
async function readLoop(){
  let buffer='';const decoder=new TextDecoder();
  try{while(reader){const {value,done}=await reader.read();if(done)break;
    buffer+=decoder.decode(value,{stream:true});let i;
    while((i=buffer.indexOf('\n'))>=0){telemetry(buffer.slice(0,i));buffer=buffer.slice(i+1);}
    if(buffer.length>1024)buffer='';
  }}catch(e){el('status').textContent='讀取中斷：'+e.message;}
  finally{ready=false;armed=false;pendingEnable=false;epoch++;controls();}
}
async function disconnect(){
  if(closing)return;closing=true;controls();
  await Promise.race([stop('斷線'),new Promise(r=>setTimeout(r,150))]);
  try{if(reader){await reader.cancel();await readTask;reader.releaseLock();reader=null;}
    if(writer){await writer.abort();writer.releaseLock();writer=null;}
    if(port)await port.close();
  }catch(e){el('log').textContent='關閉連線：'+e.message;}
  finally{port=null;ready=false;armed=false;closing=false;epoch++;chain=Promise.resolve();controls();el('status').textContent='已斷線';}
}
el('connect').onclick=async()=>{
  if(!navigator.serial){el('status').textContent='請使用支援 Web Serial 的 Chrome 與 localhost';return;}
  if(port||closing)return;
  try{port=await navigator.serial.requestPort();controls();await port.open({baudRate:115200});
    writer=port.writable.getWriter();reader=port.readable.getReader();ready=false;armed=false;
    el('status').textContent='等待 $VROTATE,6 專用韌體遙測';readTask=readLoop();await stop();
  }catch(e){el('log').textContent=e.message;await disconnect();}
};
el('enable').onclick=async()=>{
  if(!ready||armed||pendingEnable||closing||performance.now()-lastTelemetry>350)return;
  epoch++;const ticket=epoch;
  pendingEnable=true;enableWritten=false;enableStarted=performance.now();
  controls();el('status').textContent='等待韌體確認啟用（尚不可移動）';
  await send('E');
  if(ticket===epoch&&pendingEnable)enableWritten=true;
};
el('stop').onclick=()=>stop('停止按鈕');el('disconnect').onclick=disconnect;
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();e.stopPropagation();if(!e.repeat)(e.code==='Space'?disconnect():stop('Enter'));
  }
},true);
window.addEventListener('blur',()=>stop('視窗失去焦點'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop('頁面隱藏');});
window.addEventListener('pagehide',()=>stop('離開頁面'));
if(navigator.serial)navigator.serial.addEventListener('disconnect',disconnect);
setInterval(()=>{
  if(ready&&performance.now()-lastTelemetry>350){stop('遙測超過 350 ms 未更新');ready=false;controls();}
  if(pendingEnable&&performance.now()-enableStarted>=ENABLE_TIMEOUT_MS)stop('啟用確認超過 1 秒');
  if(pendingEnable&&enableWritten)send('P');
  ping();
},50);
</script></html>
