; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter =
	+<*>
	-<Bench/>
build_flags =      ;if have new nodule, add -I src/ModuleName
    -I src/Chassis
	-I src/Vision
	-I src/Constants
	-I src/Shooter
	-I src/Dribbler
	-I src/Auto
	-I src/IO
	-I src/Telemetry
	-I src/Sensors
	-I src/Control

lib_deps =
	ericksimoes/Ultrasonic@^3.0.0
	arduino-libraries/Servo@^1.3.0
	br3ttb/PID@^1.2.1

[env:mega_shooter_keyboard_test]
extends = env:megaatmega2560
build_src_filter =
	-<*>
	+<Bench/ShooterKeyboardTest.cpp>
	+<Shooter/>
	+<Sensors/>
	+<Control/>
	+<Vision/>
build_flags =
	-I src/Bench
	-I src/Constants
	-I src/Shooter
	-I src/Sensors
	-I src/Control
	-I src/Vision
lib_deps =
	arduino-libraries/Servo@^1.3.0

; A5 driven by Orin vision data over Serial1, isolated from production
; Shooter/Vision. Kept as the one standalone rotate/vision bench; the
; manual-jog-only and UART-bare-diagnostic benches were retired 2026-10-06
; once production Shooter gained its own VISION_FOLLOW mode.
[env:mega_vision_rotate_test]
extends = env:mega_shooter_keyboard_test
build_src_filter =
    -<*>
    +<Bench/VisionRotateTest.cpp>
    +<Control/>

; Standalone Mega <-> STM32 UART link test (Serial2 D16/D17 @115200), see
; tools/stm32_mega_uart_test/README.md. Builds only the test sketch and the
; shared protocol in src/Bench/UartLinkTest/ -- no motors or other
; subsystems, so it can't contend with the robot build for Serial2.
; Bigger serial buffers so a 1 s USB progress print can't make Serial2 drop
; incoming bytes.
[env:mega_uart_link_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter =
	-<*>
	+<Bench/UartLinkTest/>
build_flags =
	-D SERIAL_RX_BUFFER_SIZE=256
	-D SERIAL_TX_BUFFER_SIZE=256

; ELRS downlink bench test: production MechLink (Serial2 D16/D17) + a sketch
; that prints decoded channels and link-state changes. See
; tools/stm32_elrs_robot_bridge/README.md "Bench test with the Mega".
[env:mega_elrs_link_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter =
	-<*>
	+<Bench/ElrsLinkTest/>
	+<IO/MechLink.cpp>
	+<IO/RcControlMap.c>
build_flags =
	-D SERIAL_RX_BUFFER_SIZE=256
	-D SERIAL_TX_BUFFER_SIZE=256

; USB Mega only: wireless cannot arm, L cannot enable vision, Auto inactive.
[env:mega_wired_manual_test]
extends = env:megaatmega2560
build_flags =
    ${env:megaatmega2560.build_flags}
    -D TEL_WIRED_MANUAL_ONLY

; Confirmed D45/D46/D48 only; no shooter or tower hardware outputs.
[env:mega_drive_conveyor_test]
extends = env:mega_wired_manual_test
build_flags =
    ${env:mega_wired_manual_test.build_flags}
    -D TEL_DRIVE_CONVEYOR_ONLY

; Adds confirmed D24 positional elevation and D23 manual turret.
; D25 flywheel slider enabled; tower and unconfirmed sensors inactive.
[env:mega_manual_axes_test]
extends = env:mega_drive_conveyor_test
build_flags =
    ${env:mega_drive_conveyor_test.build_flags}
    -D TEL_MANUAL_AXES_TEST
    -D TEL_MANUAL_FLYWHEEL_TEST
