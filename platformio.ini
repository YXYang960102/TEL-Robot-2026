; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter =
	+<*>
	-<Bench/>
	-<Sensors/>
	-<Actuators/>
build_flags =      ;if have new nodule, add -I src/ModuleName
    -I src/Chassis
	-I src/Vision
	-I src/Constants
	-I src/Shooter
	-I src/Dribbler
	-I src/Auto
	-I src/IO
	-I src/Telemetry
	-I src/Sensors
	-I src/Actuators
   
lib_deps = 
	ericksimoes/Ultrasonic@^3.0.0
	arduino-libraries/Servo@^1.3.0
	br3ttb/PID@^1.2.1

[env:uno_as5600_servo_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter =
	-<*>
	+<Bench/>
	+<Sensors/>
	+<Actuators/>
	+<Constants/>
build_flags =
	-I src/Bench
	-I src/Sensors
	-I src/Actuators
	-I src/Constants
lib_deps =
	arduino-libraries/Servo@^1.3.0
