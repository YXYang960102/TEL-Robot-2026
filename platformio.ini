; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter =
	+<*>
	-<Bench/>
build_flags =      ;if have new nodule, add -I src/ModuleName
    -I src/Chassis
	-I src/Vision
	-I src/Constants
	-I src/Shooter
	-I src/Dribbler
	-I src/Auto
	-I src/IO
	-I src/Telemetry
	-I src/Sensors
	-I src/Control

lib_deps =
	ericksimoes/Ultrasonic@^3.0.0
	arduino-libraries/Servo@^1.3.0
	br3ttb/PID@^1.2.1

[env:mega_shooter_keyboard_test]
extends = env:megaatmega2560
build_src_filter =
	-<*>
	+<Bench/ShooterKeyboardTest.cpp>
	+<Shooter/>
	+<Sensors/>
	+<Control/>
	+<Vision/>
build_flags =
	-I src/Bench
	-I src/Constants
	-I src/Shooter
	-I src/Sensors
	-I src/Control
	-I src/Vision
lib_deps =
	arduino-libraries/Servo@^1.3.0

; A5 driven by Orin vision data over Serial1, isolated from production
; Shooter/Vision. Kept as the one standalone rotate/vision bench; the
; manual-jog-only and UART-bare-diagnostic benches were retired 2026-10-06
; once production Shooter gained its own VISION_FOLLOW mode.
[env:mega_vision_rotate_test]
extends = env:mega_shooter_keyboard_test
build_src_filter =
    -<*>
    +<Bench/VisionRotateTest.cpp>
    +<Control/>
