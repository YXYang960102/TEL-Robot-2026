; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter =
	+<*>
	-<Bench/>
build_flags =      ;if have new nodule, add -I src/ModuleName
    -I src/Chassis
	-I src/Vision
	-I src/Constants
	-I src/Shooter
	-I src/Dribbler
	-I src/Auto
	-I src/IO
	-I src/Sensors
	-I src/Control
   
lib_deps =
	ericksimoes/Ultrasonic@^3.0.0
	arduino-libraries/Servo@^1.3.0

[env:mega_shooter_keyboard_test]
extends = env:megaatmega2560
build_src_filter =
	-<*>
	+<Bench/ShooterKeyboardTest.cpp>
	+<Shooter/>
	+<Sensors/>
	+<Control/>
build_flags =
	-I src/Bench
	-I src/Constants
	-I src/Shooter
	-I src/Sensors
	-I src/Control
lib_deps =
	arduino-libraries/Servo@^1.3.0

; Only A5 is attached. No Shooter/AS5600/potentiometer/flywheel initialization.
[env:mega_rotate_only_test]
extends = env:mega_shooter_keyboard_test
build_src_filter =
    -<*>
    +<Bench/RotateOnlyTest.cpp>

; A5 driven by Orin vision data over Serial1 instead of the browser keyboard.
; Parallel to mega_rotate_only_test; does not touch it or production Vision.
[env:mega_vision_rotate_test]
extends = env:mega_shooter_keyboard_test
build_src_filter =
    -<*>
    +<Bench/VisionRotateTest.cpp>
    +<Control/>

; Bare Mega UART diagnostic: no actuators, sensors, or external connections.
[env:mega_uart_bare_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<Bench/UartBareTest.cpp>
